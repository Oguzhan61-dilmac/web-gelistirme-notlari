<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sayfa Duzeni</title>
    <style>

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: chocolate;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #sayfa {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 14px;
            border: 2px solid #4a2f18;
            background-color: transparent;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        header,
        nav,
        footer {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            min-height: 68px;
        }

        header {
            border: 4px dotted #c10000;
            background: #fff4f4;
        }

        nav {
            border: 4px dashed #118a3c;
            background: #f1fff6;
        }
        article {
            flex: 2;
            border: 4px solid #1247c5;
            background: #f2f6ff;
            min-height: 220px;
            padding: 14px;
            float: left;
        }

        aside {
            flex: 1;
            border: 4px solid #d27900;
            background: #fff8ef;
            min-height: 220px;
            padding: 14px; 
            float: right;
        }

        footer {
            border: 4px dotted #d4b100;
            background: #fffde8;
            margin-bottom: 0;
            margin-top: auto;
        }

        
    </style>
</head>
<body>
    <div id="sayfa">
        <header>
            buraya logo ve reklam gelecek
        </header>

        <nav>
            buraya ana menu gelecek
        </nav>
            <article>
                buraya icerik gelecek
            </article>

            <aside>
                buraya yan menu gelecek
            </aside>
        </div>

        <footer>
            buraya iletisim bilgileri gelecek
        </footer>
    </div>
</body>
</html>
