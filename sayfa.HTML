<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="stil.css">
     <title>Kutu</title>
     <style>
        #sayfa {
            border-style: solid ;
            width: 300px;
            margin: auto;
            background-color: chocolate;

        }
        header {
            border-style: dotted;
            border-width: 10px ;
            border-color: red ;
            padding: 10px;
            margin:auto;
            height: 50px;

        }
        nav {
            border-style: dashed;
            border-width: 10px ;
            border-color: green ;
            padding: 10px;
            margin:auto;
            height: 50px;

        }
        article {
            border-style: solid;
            border-width: 10px ;
            border-color: blue ;
            padding: 10px;
            margin:auto;
            height: 150px;

        }
        footer {
            border-style: dotted;
            border-width: 10px ;
            border-color: yellow ;
            padding: 10px;
            margin:auto;
            height: 50px;

        }
     </style>
</head>
<body>
    <div id="sayfa">
          <header>
               buraya logo ve reklam gelecek 
          </header>
          <nav>
               buraya  ana menü gelecek
          </nav>
          <article>
               buraya içerik gelecek    
          </article>
          <footer>
               buraya iletişim bilgileri gelecek
          </footer>
    </div>
</body>
</html>
